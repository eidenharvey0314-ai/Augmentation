<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Tracking</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

<style>

body{
margin:0;
overflow:hidden;
background:black;
}

canvas{
position:absolute;
top:0;
left:0;
}

</style>
</head>
<body>

<video id="video" autoplay playsinline style="display:none"></video>
<canvas id="canvas"></canvas>

<script>

const video = document.getElementById("video")
const canvas = document.getElementById("canvas")
const ctx = canvas.getContext("2d")

let detector

// Detect device
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
const FPS = isMobile ? 9 : 12
const interval = 1000 / FPS

function resize(){
canvas.width = window.innerWidth
canvas.height = window.innerHeight
}
resize()
window.addEventListener("resize", resize)

async function startCamera(){

try{

const stream = await navigator.mediaDevices.getUserMedia({
video:true,
audio:false
})

video.srcObject = stream

}catch(error){

if(error.name === "NotReadableError"){
alert("Camera is already in use by another application.")
}

else if(error.name === "NotAllowedError"){
alert("Camera permission denied.")
}

else{
alert("Camera error: " + error.message)
}

console.error(error)

}

}

async function loadModel(){

const model = poseDetection.SupportedModels.MoveNet

detector = await poseDetection.createDetector(model,{
modelType:"Lightning"
})

}

function drawBox(x,y,color){

const size = 60

ctx.strokeStyle = color
ctx.lineWidth = 3
ctx.strokeRect(x-size/2,y-size/2,size,size)

}

let lastFrame = 0

async function detect(time){

if(time-lastFrame < interval){
requestAnimationFrame(detect)
return
}

lastFrame = time

ctx.drawImage(video,0,0,canvas.width,canvas.height)

const poses = await detector.estimatePoses(video)

if(poses.length>0){

const kp = poses[0].keypoints

const nose = kp.find(p=>p.name==="nose")
const leftWrist = kp.find(p=>p.name==="left_wrist")
const rightWrist = kp.find(p=>p.name==="right_wrist")

if(nose && nose.score > 0.4){

const x = nose.x * canvas.width / video.videoWidth
const y = nose.y * canvas.height / video.videoHeight

drawBox(x,y,"#00ffff") // head

}

if(leftWrist && leftWrist.score > 0.4){

const x = leftWrist.x * canvas.width / video.videoWidth
const y = leftWrist.y * canvas.height / video.videoHeight

drawBox(x,y,"#00ff00") // left hand

}

if(rightWrist && rightWrist.score > 0.4){

const x = rightWrist.x * canvas.width / video.videoWidth
const y = rightWrist.y * canvas.height / video.videoHeight

drawBox(x,y,"#ff00ff") // right hand

}

}

requestAnimationFrame(detect)

}

async function init(){

await startCamera()
await loadModel()

requestAnimationFrame(detect)

}

init()

</script>

</body>
</html>
