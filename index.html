<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Face Tracking Camera</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
  font-family: sans-serif;
}

video, canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
}

canvas {
  pointer-events: none;
}

#errorMsg {
  position: absolute;
  z-index: 10;
  background: rgba(0,0,0,0.7);
  padding: 1em;
  border-radius: 8px;
  text-align: center;
}
</style>
</head>
<body>

<div id="errorMsg" style="display:none;"></div>
<video id="video" autoplay playsinline></video>
<canvas id="overlay"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const errorMsg = document.getElementById("errorMsg");

// FPS control
const FPS = 12;
const interval = 1000 / FPS;

// Safe camera setup with fallback and error handling
async function setupCamera() {
  const constraintsList = [
    { video: { facingMode: "user", width: 640, height: 480 } },  // front camera
    { video: { width: 640, height: 480 } },                       // any camera
  ];

  for (let constraints of constraintsList) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      return new Promise(resolve => {
        video.onloadedmetadata = () => resolve(video);
      });
    } catch (err) {
      console.warn("Camera constraint failed:", err);
    }
  }

  throw new Error("No available camera. Close other apps, allow permissions, and reload.");
}

// Start face tracking
async function startTracking() {
  try {
    await setupCamera();
  } catch (err) {
    console.error(err);
    errorMsg.innerText = err.message;
    errorMsg.style.display = "block";
    return;
  }

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const model = await blazeface.load();

  let lastTime = performance.now();

  async function detectLoop() {
    const now = performance.now();
    const delta = now - lastTime;

    if (delta > interval) {
      lastTime = now - (delta % interval);

      const predictions = await model.estimateFaces(video, false);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      predictions.forEach(prediction => {
        const start = prediction.topLeft;
        const end = prediction.bottomRight;
        const x = start[0];
        const y = start[1];
        const width = end[0] - start[0];
        const height = end[1] - start[1];

        ctx.strokeStyle = "lime";
        ctx.lineWidth = 4;
        ctx.strokeRect(x, y, width, height);
      });
    }

    requestAnimationFrame(detectLoop);
  }

  detectLoop();
}

// Handle window resize
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

startTracking();
</script>

</body>
</html>
