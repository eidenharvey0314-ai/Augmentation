<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptive Camera Tracking</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

<style>
body{
margin:0;
overflow:hidden;
background:black;
}

canvas{
position:absolute;
top:0;
left:0;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline style="display:none"></video>
<canvas id="canvas"></canvas>

<script>

const video = document.getElementById("video")
const canvas = document.getElementById("canvas")
const ctx = canvas.getContext("2d")

let detector

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)

// Starting FPS
let targetFPS = isMobile ? 10 : 12
let interval = 1000 / targetFPS

function resize(){
canvas.width = window.innerWidth
canvas.height = window.innerHeight
}
resize()
window.addEventListener("resize", resize)

async function startCamera(){

const stream = await navigator.mediaDevices.getUserMedia({
video:{
width: isMobile ? 480 : 1280,
height: isMobile ? 360 : 720,
frameRate: isMobile ? 15 : 30,
facingMode:"user"
},
audio:false
})

video.srcObject = stream

return new Promise(resolve=>{
video.onloadedmetadata = () => resolve()
})

}

async function loadModel(){

await tf.setBackend("webgl")   // GPU acceleration
await tf.ready()

const model = poseDetection.SupportedModels.MoveNet

detector = await poseDetection.createDetector(model,{
modelType:"Lightning"
})

}

function drawBox(x,y,color){

const size = 60

ctx.strokeStyle = color
ctx.lineWidth = 3
ctx.strokeRect(x-size/2,y-size/2,size,size)

}

let lastFrame = 0

async function detect(time){

if(time-lastFrame < interval){
requestAnimationFrame(detect)
return
}

lastFrame = time

const start = performance.now()

ctx.drawImage(video,0,0,canvas.width,canvas.height)

const poses = await detector.estimatePoses(video)

if(poses.length){

const kp = poses[0].keypoints

const nose = kp.find(p=>p.name==="nose")
const left = kp.find(p=>p.name==="left_wrist")
const right = kp.find(p=>p.name==="right_wrist")

if(nose?.score > 0.4){
drawBox(
nose.x * canvas.width / video.videoWidth,
nose.y * canvas.height / video.videoHeight,
"#00ffff"
)
}

if(left?.score > 0.4){
drawBox(
left.x * canvas.width / video.videoWidth,
left.y * canvas.height / video.videoHeight,
"#00ff88"
)
}

if(right?.score > 0.4){
drawBox(
right.x * canvas.width / video.videoWidth,
right.y * canvas.height / video.videoHeight,
"#ff66ff"
)
}

}

const end = performance.now()
const frameTime = end - start

// Adaptive FPS logic
if(frameTime > 120 && targetFPS > 6){
targetFPS--
interval = 1000 / targetFPS
}

if(frameTime < 70 && targetFPS < (isMobile ? 10 : 12)){
targetFPS++
interval = 1000 / targetFPS
}

requestAnimationFrame(detect)

}

async function init(){

await startCamera()
await loadModel()

requestAnimationFrame(detect)

}

init()

</script>

</body>
</html>
