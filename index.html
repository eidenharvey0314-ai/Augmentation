<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Zoom Detection</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>

body{
margin:0;
overflow:hidden;
background:black;
}

video{
display:none;
}

canvas{
position:absolute;
top:0;
left:0;
}

</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>

const video = document.getElementById("video")
const canvas = document.getElementById("canvas")
const ctx = canvas.getContext("2d")

canvas.width = window.innerWidth
canvas.height = window.innerHeight

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)

let zoom = 1
let lastSpread = 0

function distance(a,b){

return Math.sqrt(
Math.pow(a.x-b.x,2) +
Math.pow(a.y-b.y,2)
)

}

const hands = new Hands({
locateFile: (file)=>{
return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
}
})

hands.setOptions({

maxNumHands:1,
modelComplexity:0,   // mobile optimized
minDetectionConfidence:0.7,
minTrackingConfidence:0.6

})

hands.onResults(results=>{

ctx.clearRect(0,0,canvas.width,canvas.height)

ctx.save()

// zoom effect
ctx.translate(canvas.width/2,canvas.height/2)
ctx.scale(zoom,zoom)
ctx.translate(-canvas.width/2,-canvas.height/2)

ctx.drawImage(video,0,0,canvas.width,canvas.height)

ctx.restore()

if(results.multiHandLandmarks.length){

const hand = results.multiHandLandmarks[0]

// fingertip indexes
const thumb = hand[4]
const index = hand[8]
const middle = hand[12]
const ring = hand[16]
const pinky = hand[20]

// measure finger spread
const spread =
distance(index,pinky) +
distance(thumb,middle)

if(lastSpread !== 0){

if(spread > lastSpread + 0.02){

zoom += 0.03
}

if(spread < lastSpread - 0.02){

zoom -= 0.03
}

zoom = Math.max(1, Math.min(2.5, zoom))

}

lastSpread = spread

// draw fingertip markers

const tips = [thumb,index,middle,ring,pinky]

for(let p of tips){

ctx.beginPath()
ctx.arc(
p.x * canvas.width,
p.y * canvas.height,
10,
0,
Math.PI*2
)

ctx.fillStyle="#00ffff"
ctx.fill()

}

}

})

async function start(){

const stream = await navigator.mediaDevices.getUserMedia({
video:{
width: isMobile ? 480 : 1280,
height: isMobile ? 360 : 720,
facingMode:"user"
},
audio:false
})

video.srcObject = stream

video.onloadedmetadata = ()=>{

video.play()

const camera = new Camera(video,{
onFrame: async ()=>{
await hands.send({image:video})
},
width: canvas.width,
height: canvas.height
})

camera.start()

}

}

start()

</script>

</body>
</html>
