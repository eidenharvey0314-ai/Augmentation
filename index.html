<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pose Detection</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;background:black;}

video{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
object-fit:cover;
transform:scaleX(-1);
}

canvas{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
pointer-events:none;
}

#switchCamera{
position:absolute;
top:20px;
right:20px;
background:white;
padding:10px 15px;
border-radius:8px;
font-weight:bold;
z-index:10;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="switchCamera">Switch Camera</div>

<script>

const video = document.getElementById("video")
const canvas = document.getElementById("canvas")
const ctx = canvas.getContext("2d")

let detector
let facingMode = "environment"

// Detect mobile
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)

// FPS settings
const targetFPS = isMobile ? 9 : 12
const frameInterval = 1000 / targetFPS

let lastFrame = 0

function resizeCanvas(){
canvas.width = video.videoWidth
canvas.height = video.videoHeight
}

async function startCamera(mode){

if(video.srcObject)
video.srcObject.getTracks().forEach(t=>t.stop())

const stream = await navigator.mediaDevices.getUserMedia({
video:{facingMode:mode},
audio:false
})

video.srcObject = stream

await new Promise(resolve=>{
video.onloadedmetadata = ()=>{
video.play()
resizeCanvas()
resolve()
}
})

}

async function init(){

await startCamera(facingMode)

detector = await poseDetection.createDetector(
poseDetection.SupportedModels.MoveNet,
{modelType:'lightning'}
)

detectLoop()

}

function getBox(points){

let xs=[]
let ys=[]

points.forEach(p=>{
if(p && p.score>0.35){
xs.push(p.x)
ys.push(p.y)
}
})

if(xs.length===0) return null

const padding = 20

const minX = Math.min(...xs) - padding
const maxX = Math.max(...xs) + padding
const minY = Math.min(...ys) - padding
const maxY = Math.max(...ys) + padding

return [minX,minY,maxX-minX,maxY-minY]

}

function drawBox(box,color,label){

if(!box) return

const [x,y,w,h] = box

ctx.fillStyle = color
ctx.fillRect(x,y,w,h)

ctx.strokeStyle = color.replace("0.35","1")
ctx.lineWidth = 2
ctx.strokeRect(x,y,w,h)

ctx.fillStyle = "white"
ctx.font = "16px Arial"
ctx.fillText(label,x,y-6)

}

async function detectLoop(){

requestAnimationFrame(detectLoop)

const now = performance.now()
if(now-lastFrame < frameInterval) return
lastFrame = now

ctx.clearRect(0,0,canvas.width,canvas.height)
ctx.drawImage(video,0,0)

if(video.readyState < 4) return

const poses = await detector.estimatePoses(video)

poses.forEach(pose=>{

const k = pose.keypoints

const headPoints = [
k[0],k[1],k[2],k[3],k[4]
]

const bodyPoints = [
k[5],k[6],k[11],k[12]
]

const handPoints = [
k[9],k[10]
]

const headBox = getBox(headPoints)
const bodyBox = getBox(bodyPoints)
const handBox = getBox(handPoints)

drawBox(headBox,"rgba(255,182,193,0.35)","Head")
drawBox(bodyBox,"rgba(173,216,230,0.35)","Body")
drawBox(handBox,"rgba(144,238,144,0.35)","Hands")

})

}

document.getElementById("switchCamera").onclick=()=>{

facingMode = facingMode==="environment" ? "user" : "environment"
startCamera(facingMode)

}

init()

</script>

</body>
</html>
