```html
<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>VR Hand Camera</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>

body{
margin:0;
overflow:hidden;
background:black;
touch-action:none;
}

canvas{
position:absolute;
top:0;
left:0;
}

/* UI container */

#uiContainer{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
display:flex;
flex-direction:column;
gap:10px;
z-index:10;
}

#uiContainer button{
padding:12px 20px;
font-size:16px;
border:none;
border-radius:8px;
font-weight:bold;
}

#switchBtn{background:#00ffff;color:black;}
#vrBtn{background:#ff44ff;color:white;}
#uiBtn{background:#222;color:white;}

</style>
</head>

<body>

<video id="video" autoplay playsinline style="display:none"></video>
<canvas id="canvas"></canvas>

<div id="uiContainer">
<button id="switchBtn">Switch Camera</button>
<button id="vrBtn">VR Mode</button>
<button id="uiBtn">Hide UI</button>
</div>

<script>

const video=document.getElementById("video")
const canvas=document.getElementById("canvas")
const ctx=canvas.getContext("2d")

const switchBtn=document.getElementById("switchBtn")
const vrBtn=document.getElementById("vrBtn")
const uiBtn=document.getElementById("uiBtn")
const uiContainer=document.getElementById("uiContainer")

const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
const isiPhone=/iPhone/i.test(navigator.userAgent)

canvas.width=window.innerWidth
canvas.height=window.innerHeight

let currentFacing="environment"
let stream=null

let zoom=1
let lastSpread=0
let vrMode=false

let uiHidden=false

let ultraWideId=null
let normalCamId=null

function resizeCanvas(){

canvas.width=window.innerWidth
canvas.height=window.innerHeight

if(isiPhone && window.innerHeight>window.innerWidth){
canvas.style.transform="rotate(90deg)"
canvas.style.transformOrigin="center"
}else{
canvas.style.transform="none"
}

}

function cyberpunkZoomEffect(){

ctx.save()

ctx.globalAlpha=0.35
ctx.drawImage(canvas,3,0)

ctx.globalCompositeOperation="lighter"
ctx.drawImage(canvas,-3,0)

ctx.globalCompositeOperation="source-over"

for(let y=0;y<canvas.height;y+=4){
ctx.fillStyle="black"
ctx.fillRect(0,y,canvas.width,1)
}

ctx.restore()

}

function applyLensDistortion(){

const strength=0.15
const w=canvas.width
const h=canvas.height

ctx.translate(w/2,h/2)
ctx.scale(1+strength,1+strength)
ctx.translate(-w/2,-h/2)

}

async function detectCameras(){

const devices=await navigator.mediaDevices.enumerateDevices()

devices.forEach(d=>{
if(d.kind==="videoinput"){

const name=d.label.toLowerCase()

if(name.includes("ultra") || name.includes("wide") || name.includes("0.5")){
ultraWideId=d.deviceId
}else{
normalCamId=d.deviceId
}

}

})

}

async function startCamera(){

if(stream) stream.getTracks().forEach(t=>t.stop())

let videoOptions

if(isMobile && ultraWideId){
videoOptions={
deviceId:{exact:ultraWideId},
width:640,
height:480
}
}else{
videoOptions={
facingMode:currentFacing,
width:isMobile?640:1280,
height:isMobile?480:720
}
}

stream=await navigator.mediaDevices.getUserMedia({
video:videoOptions,
audio:false
})

video.srcObject=stream
await video.play()

}

function drawFrame(){

ctx.clearRect(0,0,canvas.width,canvas.height)

if(!vrMode){

ctx.drawImage(video,0,0,canvas.width,canvas.height)

}else{

ctx.save()

applyLensDistortion()

const half=canvas.width/2
const offset=20

ctx.drawImage(video,-offset,0,canvas.width,canvas.height,0,0,half,canvas.height)
ctx.drawImage(video,offset,0,canvas.width,canvas.height,half,0,half,canvas.height)

ctx.restore()

ctx.fillStyle="black"
ctx.fillRect(half-2,0,4,canvas.height)

}

requestAnimationFrame(drawFrame)

}

switchBtn.onclick=async()=>{
currentFacing=currentFacing==="user"?"environment":"user"
await startCamera()
}

async function enterVR(){

try{

if(document.documentElement.requestFullscreen){
await document.documentElement.requestFullscreen()
}

if(screen.orientation && screen.orientation.lock){
await screen.orientation.lock("landscape")
}

}catch(e){}

if(isiPhone){

document.body.style.position="fixed"
document.body.style.width="100vw"
document.body.style.height="100vh"

}

resizeCanvas()

}

async function exitVR(){

try{

if(document.fullscreenElement){
await document.exitFullscreen()
}

}catch(e){}

if(isiPhone){

document.body.style.position=""
document.body.style.width=""
document.body.style.height=""

}

resizeCanvas()

}

vrBtn.onclick=async()=>{

vrMode=!vrMode

if(vrMode){
vrBtn.innerText="Exit VR"
await enterVR()
}else{
vrBtn.innerText="VR Mode"
await exitVR()
}

}

uiBtn.addEventListener("pointerdown",(e)=>{

e.stopPropagation()

uiContainer.style.display="none"
uiHidden=true

})

document.addEventListener("pointerdown",()=>{

if(uiHidden){

uiContainer.style.display="flex"
uiHidden=false

}

})

window.addEventListener("resize",resizeCanvas)
window.addEventListener("orientationchange",resizeCanvas)

async function init(){

await detectCameras()
await startCamera()
drawFrame()

}

init()

</script>

</body>
</html>
