<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Head & Hand Tracking Camera</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection/dist/hand-pose-detection.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: black; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; }
video, canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; }
canvas { pointer-events: none; }
#errorMsg { position: absolute; z-index: 10; background: rgba(0,0,0,0.7); padding: 1em; border-radius: 8px; text-align: center; }
</style>
</head>

<body>

<div id="errorMsg" style="display:none;"></div>
<video id="video" autoplay playsinline></video>
<canvas id="overlay"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const errorMsg = document.getElementById("errorMsg");

// FPS control
const FPS = 12;
const interval = 1000 / FPS;

// Setup camera with fallback
async function setupCamera() {
  const constraintsList = [
    { video: { facingMode: "user", width: 640, height: 480 } },
    { video: { width: 640, height: 480 } }
  ];
  for (let constraints of constraintsList) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      return new Promise(resolve => { video.onloadedmetadata = () => resolve(video); });
    } catch (err) { console.warn("Camera constraint failed:", err); }
  }
  throw new Error("No available camera. Close other apps, allow permissions, and reload.");
}

// Main tracking function
async function startTracking() {
  try { await setupCamera(); }
  catch (err) { console.error(err); errorMsg.innerText = err.message; errorMsg.style.display = "block"; return; }

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  // Load models
  const faceModel = await blazeface.load();
  const handModel = await handPoseDetection.createDetector(handPoseDetection.SupportedModels.MediaPipeHands, {
    runtime: 'tfjs',
    maxHands: 2
  });

  let lastTime = performance.now();

  async function detectLoop() {
    const now = performance.now();
    const delta = now - lastTime;

    if (delta > interval) {
      lastTime = now - (delta % interval);
      ctx.clearRect(0,0,canvas.width,canvas.height);

      // --- Face Detection ---
      const faces = await faceModel.estimateFaces(video, false);
      faces.forEach(prediction => {
        const [x1, y1] = prediction.topLeft;
        const [x2, y2] = prediction.bottomRight;
        ctx.strokeStyle = "lime";
        ctx.lineWidth = 4;
        ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
      });

      // --- Hand Detection ---
      const hands = await handModel.estimateHands(video, { flipHorizontal: true });
      hands.forEach(hand => {
        const bbox = hand.boundingBox;
        const x = bbox.topLeft[0];
        const y = bbox.topLeft[1];
        const width = bbox.bottomRight[0] - bbox.topLeft[0];
        const height = bbox.bottomRight[1] - bbox.topLeft[1];
        ctx.strokeStyle = "aqua";
        ctx.lineWidth = 4;
        ctx.strokeRect(x, y, width, height);
      });
    }

    requestAnimationFrame(detectLoop);
  }

  detectLoop();
}

// Resize canvas on window change
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

startTracking();
</script>

</body>
</html>
