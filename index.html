<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Updated Face, Hand & Body Detection</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
body{
margin:0;
overflow:hidden;
background:black;
}
video, canvas{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
}
#status{
position:absolute;
top:10px;
left:10px;
color:white;
background:rgba(0,0,0,0.5);
padding:6px 10px;
font-family:sans-serif;
border-radius:6px;
z-index:10;
}
#switchBtn{
position:absolute;
top:50px;
left:10px;
z-index:10;
padding:6px 10px;
border:none;
border-radius:6px;
background:rgba(255,255,255,0.8);
color:black;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div id="status">Starting camera...</div>
<button id="switchBtn">Switch Camera</button>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");
const switchBtn = document.getElementById("switchBtn");

let resultsData = null;
let cameraFacingMode = "user"; // front by default
let cameraMP = null;

function isMobile(){
return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

// Reduced FPS for mobile to 8-9
const FPS = isMobile() ? 9 : 12;

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Holistic model
const holistic = new Holistic({
locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`
});

holistic.setOptions({
modelComplexity:0.2,
smoothLandmarks:true,
enableSegmentation:false,
minDetectionConfidence:0.5,
minTrackingConfidence:0.5
});

holistic.onResults((results)=>{
resultsData = results;
});

// Start camera
async function startCamera(){
if(cameraMP){
cameraMP.stop();
}

let frameCounter = 0;
cameraMP = new Camera(video, {
  onFrame: async () => {
    frameCounter++;
    if(frameCounter % 2 === 0){
      await holistic.send({image: video});
    }
  },
  width:685,
  height:510,
  facingMode: cameraFacingMode
});

cameraMP.start().then(()=>{
statusText.innerText="Camera running ("+cameraFacingMode+")";
});
}

startCamera();

// Switch camera button
switchBtn.addEventListener("click",()=>{
cameraFacingMode = (cameraFacingMode === "user") ? "environment" : "user";
startCamera();
});

// Draw function
function drawBoxes(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.drawImage(video,0,0,canvas.width,canvas.height);

if(!resultsData) return;

// FACE box
if(resultsData.faceLandmarks){
let xVals = resultsData.faceLandmarks.map(l => l.x);
let yVals = resultsData.faceLandmarks.map(l => l.y);
let minX=Math.min(...xVals)*canvas.width;
let maxX=Math.max(...xVals)*canvas.width;
let minY=Math.min(...yVals)*canvas.height;
let maxY=Math.max(...yVals)*canvas.height;
ctx.fillStyle="rgba(0,255,0,0.25)";
ctx.strokeStyle="lime";
ctx.lineWidth=2;
ctx.fillRect(minX,minY,maxX-minX,maxY-minY);
ctx.strokeRect(minX,minY,maxX-minX,maxY-minY);
}

// HANDS box
["leftHandLandmarks","rightHandLandmarks"].forEach(hand=>{
if(resultsData[hand]){
let xVals = resultsData[hand].map(l=>l.x);
let yVals = resultsData[hand].map(l=>l.y);
let minX=Math.min(...xVals)*canvas.width;
let maxX=Math.max(...xVals)*canvas.width;
let minY=Math.min(...yVals)*canvas.height;
let maxY=Math.max(...yVals)*canvas.height;
ctx.fillStyle="rgba(0,120,255,0.25)";
ctx.strokeStyle="cyan";
ctx.fillRect(minX,minY,maxX-minX,maxY-minY);
ctx.strokeRect(minX,minY,maxX-minX,maxY-minY);
}
});

// BODY box
if(resultsData.poseLandmarks){
let xVals = resultsData.poseLandmarks.map(l=>l.x);
let yVals = resultsData.poseLandmarks.map(l=>l.y);
let minX=Math.min(...xVals)*canvas.width;
let maxX=Math.max(...xVals)*canvas.width;
let minY=Math.min(...yVals)*canvas.height;
let maxY=Math.max(...yVals)*canvas.height;
ctx.fillStyle="rgba(255,120,0,0.25)";
ctx.strokeStyle="orange";
ctx.fillRect(minX,minY,maxX-minX,maxY-minY);
ctx.strokeRect(minX,minY,maxX-minX,maxY-minY);
}
}

// Loop
function loop(){
drawBoxes();
setTimeout(loop,1000/FPS);
}

video.onloadeddata=()=>{
loop();
};
</script>

</body>
</html>
