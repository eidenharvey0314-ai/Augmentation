<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Human Body Detection</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;background:black;}

video{
position:fixed;
top:0;left:0;
width:100vw;height:100vh;
object-fit:cover;
transform:scaleX(-1);
}

canvas{
position:fixed;
top:0;left:0;
width:100vw;height:100vh;
pointer-events:none;
}

#switchCamera{
position:absolute;
top:20px;
right:20px;
background:white;
padding:10px 15px;
border-radius:8px;
font-weight:bold;
z-index:100;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="switchCamera">Switch Camera</div>

<script>

const video = document.getElementById("video")
const canvas = document.getElementById("canvas")
const ctx = canvas.getContext("2d")

canvas.width = window.innerWidth
canvas.height = window.innerHeight

let poseDetector
let objectDetector
let facingMode = "environment"

let lastFrame = 0

async function startCamera(mode){

if(video.srcObject)
video.srcObject.getTracks().forEach(t=>t.stop())

const stream = await navigator.mediaDevices.getUserMedia({
video:{facingMode:mode},
audio:false
})

video.srcObject = stream

await new Promise(r=>{
video.onloadedmetadata=()=>{
video.play()
r()
}
})

}

async function init(){

await startCamera(facingMode)

poseDetector = await poseDetection.createDetector(
poseDetection.SupportedModels.MoveNet,
{modelType:'lightning'}
)

objectDetector = await cocoSsd.load()

detectLoop()

}

function drawBox(x,y,w,h,color,label){

ctx.fillStyle=color
ctx.fillRect(x,y,w,h)

ctx.strokeStyle=color.replace("0.3","1")
ctx.lineWidth=2
ctx.strokeRect(x,y,w,h)

ctx.fillStyle="white"
ctx.font="16px Arial"
ctx.fillText(label,x,y-5)

}

async function detectLoop(){

requestAnimationFrame(detectLoop)

const now = performance.now()
if(now-lastFrame<100) return
lastFrame=now

ctx.clearRect(0,0,canvas.width,canvas.height)
ctx.drawImage(video,0,0,canvas.width,canvas.height)

if(video.readyState<4) return

// PERSON POSE
const poses = await poseDetector.estimatePoses(video)

poses.forEach(pose=>{

const k = pose.keypoints

const head = [k[0],k[1],k[2],k[3],k[4]]
const wrists = [k[9],k[10]]
const body = [k[5],k[6],k[11],k[12]]

function boxFromPoints(points){

let xs=[],ys=[]

points.forEach(p=>{
if(p.score>0.3){
xs.push(p.x)
ys.push(p.y)
}
})

if(xs.length==0) return null

let minX=Math.min(...xs)
let maxX=Math.max(...xs)
let minY=Math.min(...ys)
let maxY=Math.max(...ys)

return [minX,minY,maxX-minX,maxY-minY]

}

let headBox=boxFromPoints(head)
let bodyBox=boxFromPoints(body)
let handBox=boxFromPoints(wrists)

if(headBox) drawBox(...headBox,"rgba(255,0,0,0.3)","Head")
if(bodyBox) drawBox(...bodyBox,"rgba(0,255,0,0.3)","Body")
if(handBox) drawBox(...handBox,"rgba(0,0,255,0.3)","Hands")

})

// ANIMAL DETECTION
const preds = await objectDetector.detect(video)

preds.forEach(p=>{

const animals=[
"cat","dog","horse","sheep","cow","bird"
]

if(!animals.includes(p.class)) return

const [x,y,w,h]=p.bbox

drawBox(x,y,w,h,"rgba(255,255,0,0.3)",p.class)

})

}

document.getElementById("switchCamera").onclick=()=>{

facingMode = facingMode==="environment" ? "user" : "environment"
startCamera(facingMode)

}

init()

</script>

</body>
</html>
