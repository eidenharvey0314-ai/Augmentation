<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Vision System</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:black;
}

video{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
object-fit:cover;
transform:scaleX(-1);
}

canvas{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
pointer-events:none;
}

</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

/* CAMERA */

navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"}
})
.then(stream=>{
video.srcObject = stream;
});

/* LOAD AI MODELS */

let faceModel;
let objectModel;

async function loadModels(){

faceModel = await blazeface.load();
objectModel = await cocoSsd.load();

}

loadModels();

/* HAND TRACKING */

let handResults=null;

const hands = new Hands({
locateFile: file =>
`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
maxNumHands:2,
modelComplexity:0,
minDetectionConfidence:0.5,
minTrackingConfidence:0.5
});

hands.onResults(r=>{
handResults=r;
});

/* MAIN LOOP */

async function detect(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.drawImage(video,0,0,canvas.width,canvas.height);

/* FACE BOX */

if(faceModel){

const faces = await faceModel.estimateFaces(video,false);

faces.forEach(face=>{

const x = face.topLeft[0];
const y = face.topLeft[1];
const w = face.bottomRight[0]-x;
const h = face.bottomRight[1]-y;

ctx.strokeStyle="lime";
ctx.lineWidth=3;
ctx.strokeRect(x,y,w,h);

ctx.fillStyle="lime";
ctx.font="18px Arial";
ctx.fillText("Face",x,y-10);

});

}

/* OBJECT DETECTION */

if(objectModel){

const objects = await objectModel.detect(video);

objects.forEach(obj=>{

const [x,y,w,h] = obj.bbox;

/* DEPTH ESTIMATE */

const depth = Math.round(1000/(w+h));

ctx.strokeStyle="red";
ctx.lineWidth=3;
ctx.strokeRect(x,y,w,h);

ctx.fillStyle="red";
ctx.font="18px Arial";

ctx.fillText(
obj.class + " | depth:"+depth,
x,
y-10
);

});

}

/* HANDS */

if(handResults?.multiHandLandmarks){

for(const hand of handResults.multiHandLandmarks){

drawConnectors(
ctx,
hand,
HAND_CONNECTIONS,
{color:"yellow", lineWidth:3}
);

drawLandmarks(
ctx,
hand,
{color:"blue", lineWidth:2}
);

}

}

requestAnimationFrame(detect);

}

/* START CAMERA */

const camera = new Camera(video,{
onFrame: async ()=>{
await hands.send({image:video});
await detect();
},
width:960,
height:540
});

camera.start();

</script>

</body>
</html>
