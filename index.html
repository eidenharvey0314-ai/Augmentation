<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Object Detection Camera Fix</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
*{ margin:0; padding:0; box-sizing:border-box; }
body{ overflow:hidden; background:black; }
video{
    position:fixed;
    top:0; left:0;
    width:100vw; height:100vh;
    object-fit:cover;
    transform:scaleX(-1);
}
canvas{
    position:fixed;
    top:0; left:0;
    width:100vw; height:100vh;
    pointer-events:none;
}
</style>
</head>

<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// 12 common objects to detect
const DETECT_CLASSES = [
  "person","bottle","cup","chair","cell phone","laptop",
  "book","bowl","apple","banana","keyboard","mouse"
];

let model;

// Start camera function
async function startCamera(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: "environment" }, audio:false 
    });
    video.srcObject = stream;

    // Wait until the video is playing
    await new Promise(resolve => {
      video.onloadedmetadata = () => { video.play(); resolve(); };
    });
  } catch(err){
    alert("Cannot access camera: " + err);
  }
}

// Load model and start detection
async function init(){
  await startCamera();
  model = await cocoSsd.load();
  detectFrame();
}

// 12 FPS detection loop
let lastFrame = 0;
async function detectFrame(){
  requestAnimationFrame(detectFrame);

  const now = performance.now();
  if(now - lastFrame < 83) return; // ~12 FPS
  lastFrame = now;

  if(!model || video.readyState < 4) return;

  const predictions = await model.detect(video);

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  predictions.forEach(pred=>{
    if(DETECT_CLASSES.includes(pred.class)){
      const [x,y,w,h] = pred.bbox;

      ctx.fillStyle = "rgba(0,255,0,0.3)";
      ctx.fillRect(x,y,w,h);

      ctx.strokeStyle = "lime";
      ctx.lineWidth = 2;
      ctx.strokeRect(x,y,w,h);

      ctx.fillStyle = "lime";
      ctx.font = "18px Arial";
      ctx.fillText(pred.class, x, y-5);
    }
  });
}

init();
</script>

</body>
</html>
