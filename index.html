<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face & Hand Detection</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
body{
margin:0;
overflow:hidden;
background:black;
}

video,canvas{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
}

#status{
position:absolute;
top:10px;
left:10px;
color:white;
background:rgba(0,0,0,0.5);
padding:6px 10px;
font-family:sans-serif;
border-radius:6px;
}
</style>
</head>

<body>

<div id="status">Starting camera...</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");

let faces = [];
let hands = [];

function isMobile(){
return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

const FPS = isMobile() ? 10 : 12;

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

navigator.mediaDevices.getUserMedia({
video:{
width:{ideal:1280},
height:{ideal:720},
facingMode:"user"
}
})
.then(stream=>{
video.srcObject = stream;
statusText.innerText="Camera running";
})
.catch(err=>{
statusText.innerText="Camera error: "+err.message;
});





/* FACE DETECTOR */

const faceDetector = new FaceDetection({
locateFile:(file)=>{
return `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`;
}
});

faceDetector.setOptions({
modelSelection:0,
minDetectionConfidence:0.5
});

faceDetector.onResults(results=>{
faces = results.detections || [];
});





/* HAND DETECTOR */

const handDetector = new Hands({
locateFile:(file)=>{
return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
}
});

handDetector.setOptions({
maxNumHands:2,
modelComplexity:0,
minDetectionConfidence:0.6,
minTrackingConfidence:0.5
});

handDetector.onResults(results=>{
hands = results.multiHandLandmarks || [];
});





function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.drawImage(video,0,0,canvas.width,canvas.height);



/* DRAW FACE BOX */

faces.forEach(face=>{

const box = face.boundingBox;

const x = box.xCenter * canvas.width - (box.width * canvas.width)/2;
const y = box.yCenter * canvas.height - (box.height * canvas.height)/2;
const w = box.width * canvas.width;
const h = box.height * canvas.height;

ctx.fillStyle="rgba(0,255,120,0.25)";
ctx.strokeStyle="lime";
ctx.lineWidth=2;

ctx.fillRect(x,y,w,h);
ctx.strokeRect(x,y,w,h);

});



/* DRAW HAND BOX */

hands.forEach(hand=>{

let minX=1,minY=1,maxX=0,maxY=0;

hand.forEach(pt=>{
minX=Math.min(minX,pt.x);
minY=Math.min(minY,pt.y);
maxX=Math.max(maxX,pt.x);
maxY=Math.max(maxY,pt.y);
});

const x=minX*canvas.width;
const y=minY*canvas.height;
const w=(maxX-minX)*canvas.width;
const h=(maxY-minY)*canvas.height;

ctx.fillStyle="rgba(0,120,255,0.25)";
ctx.strokeStyle="cyan";

ctx.fillRect(x,y,w,h);
ctx.strokeRect(x,y,w,h);

});

}



async function process(){

if(video.readyState>=2){

await faceDetector.send({image:video});
await handDetector.send({image:video});

draw();

}

setTimeout(process,1000/FPS);

}

video.onloadeddata=()=>{
process();
};

</script>

</body>
</html>
