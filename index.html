<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Zoom Camera</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>

body{
margin:0;
overflow:hidden;
background:black;
}

canvas{
position:absolute;
top:0;
left:0;
}

button{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
padding:12px 20px;
font-size:16px;
border:none;
border-radius:8px;
background:#00ffff;
color:black;
font-weight:bold;
}

</style>
</head>

<body>

<video id="video" autoplay playsinline style="display:none"></video>
<canvas id="canvas"></canvas>
<button id="switchBtn">Switch Camera</button>

<script>

const video = document.getElementById("video")
const canvas = document.getElementById("canvas")
const ctx = canvas.getContext("2d")
const switchBtn = document.getElementById("switchBtn")

canvas.width = window.innerWidth
canvas.height = window.innerHeight

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)

if(!isMobile){
switchBtn.style.display = "none"
}

let currentFacing = "user"
let stream = null

let zoom = 1
let lastSpread = 0
let smoothedLandmarks = null

function distance(a,b){
return Math.sqrt(
Math.pow(a.x-b.x,2) +
Math.pow(a.y-b.y,2)
)
}

const hands = new Hands({
locateFile:(file)=>{
return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
}
})

hands.setOptions({

maxNumHands:1,
modelComplexity:1,
minDetectionConfidence:0.6,
minTrackingConfidence:0.6

})

hands.onResults(results=>{

ctx.clearRect(0,0,canvas.width,canvas.height)

ctx.save()

ctx.translate(canvas.width/2,canvas.height/2)
ctx.scale(zoom,zoom)
ctx.translate(-canvas.width/2,-canvas.height/2)

ctx.drawImage(video,0,0,canvas.width,canvas.height)

ctx.restore()

if(results.multiHandLandmarks.length){

const raw = results.multiHandLandmarks[0]

if(!smoothedLandmarks){
smoothedLandmarks = raw
}

const smoothFactor = 0.6

smoothedLandmarks = raw.map((p,i)=>({

x: smoothedLandmarks[i].x * smoothFactor + p.x * (1-smoothFactor),
y: smoothedLandmarks[i].y * smoothFactor + p.y * (1-smoothFactor),
z: p.z

}))

const hand = smoothedLandmarks

const thumb = hand[4]
const index = hand[8]
const middle = hand[12]
const ring = hand[16]
const pinky = hand[20]

const spread =
distance(index,pinky) +
distance(thumb,middle)

if(lastSpread !== 0){

if(spread > lastSpread + 0.02){
zoom += 0.03
}

if(spread < lastSpread - 0.02){
zoom -= 0.03
}

zoom = Math.max(1,Math.min(2.5,zoom))

}

lastSpread = spread

// detect palm vs back of hand

const palmFacingCamera =
hand[9].z < hand[0].z

const tips = [thumb,index,middle,ring,pinky]

for(let p of tips){

ctx.beginPath()

ctx.arc(
p.x * canvas.width,
p.y * canvas.height,
10,
0,
Math.PI*2
)

ctx.fillStyle = palmFacingCamera ? "#00ff88" : "#ff8800"
ctx.fill()

}

}

})

async function startCamera(){

if(stream){
stream.getTracks().forEach(track=>track.stop())
}

stream = await navigator.mediaDevices.getUserMedia({

video:{
facingMode:currentFacing,
width: isMobile ? 480 : 1280,
height: isMobile ? 360 : 720
},
audio:false

})

video.srcObject = stream

video.onloadedmetadata = ()=>{
video.play()
}

}

async function processFrame(){

if(video.readyState >= 2){
await hands.send({image:video})
}

requestAnimationFrame(processFrame)

}

switchBtn.onclick = async ()=>{

currentFacing =
currentFacing === "user"
? "environment"
: "user"

await startCamera()

}

async function init(){

await startCamera()
processFrame()

}

init()

</script>

</body>
</html>
