<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand Shape with Reliable Camera</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>

<style>
*{ margin:0; padding:0; box-sizing:border-box; }
body{ overflow:hidden; background:black; }
video{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    transform:scaleX(-1);
}
canvas{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    pointer-events:none;
}
#colorPicker{
    position:absolute;
    top:20px;
    left:20px;
    padding:10px;
    background:white;
    border-radius:8px;
    cursor:move;
    z-index:100;
}
#switchCamera{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 15px;
    background:white;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    z-index:100;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div id="colorPicker">
<label>Pick Color: </label>
<input type="color" id="colorInput" value="#FFFF00">
</div>

<div id="switchCamera">Switch Camera</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

/* Virtual Rectangle */
let rect = { x:200, y:200, w:150, h:150 };
let rectColor = "#FFFF00";
let dragging = false;
let dragOffset = {x:0,y:0};

/* HANDS */
let handLandmarks = [];

/* MediaPipe Hands */
const hands = new Hands({
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({
  maxNumHands:2,
  modelComplexity:1,
  minDetectionConfidence:0.6,
  minTrackingConfidence:0.6
});
hands.onResults(results => { handLandmarks = results.multiHandLandmarks || []; });

/* CAMERA MANAGEMENT */
let cameraInstance;
let currentFacingMode = "user";

async function startCamera(facingMode = "user"){
  if(cameraInstance) cameraInstance.stop();

  try {
    // Try requested camera first
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode } });
    video.srcObject = stream;
  } catch(err){
    console.warn("Requested camera failed, trying any available video input.", err);
    // fallback to any video device
    const devices = await navigator.mediaDevices.enumerateDevices();
    const videoDevice = devices.find(d=>d.kind==="videoinput");
    if(videoDevice){
      const stream = await navigator.mediaDevices.getUserMedia({ video:{ deviceId:{ exact: videoDevice.deviceId } } });
      video.srcObject = stream;
    } else {
      alert("No camera found!");
    }
  }

  // MediaPipe Camera wrapper for hands
  cameraInstance = new Camera(video,{
    onFrame: async ()=>{ await hands.send({image:video}); },
    width:640,
    height:480
  });

  // 12 FPS throttle
  let lastFrame = 0;
  const origOnFrame = cameraInstance.onFrame;
  cameraInstance.onFrame = async function(){
    const now = performance.now();
    if(now - lastFrame > 83){ // ~12 FPS
      await origOnFrame.call(cameraInstance);
      lastFrame = now;
    }
  }
  cameraInstance.start();
}

// Start default camera
startCamera(currentFacingMode);

// Switch Camera Button
document.getElementById("switchCamera").addEventListener("click", ()=>{
  currentFacingMode = (currentFacingMode==="user") ? "environment" : "user";
  startCamera(currentFacingMode);
});

/* Draggable Color Picker */
const picker = document.getElementById("colorPicker");
const colorInput = document.getElementById("colorInput");
let pickerDragging = false;
let pickerOffset = {x:0,y:0};

picker.addEventListener('mousedown', e=>{
  pickerDragging = true;
  pickerOffset.x = e.clientX - picker.offsetLeft;
  pickerOffset.y = e.clientY - picker.offsetTop;
});
document.addEventListener('mousemove', e=>{
  if(pickerDragging){
    picker.style.left = (e.clientX - pickerOffset.x)+"px";
    picker.style.top = (e.clientY - pickerOffset.y)+"px";
  }
});
document.addEventListener('mouseup', e=>{ pickerDragging=false; });
colorInput.addEventListener('input', e=>{ rectColor = e.target.value; });

/* UTILITY */
function distance(p1,p2){ return Math.hypot(p2.x-p1.x,p2.y-p1.y); }
function isPointInRect(px,py,r){ return px>=r.x && px<=r.x+r.w && py>=r.y && py<=r.y+r.h; }

/* DRAW LOOP */
function drawLoop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  if(handLandmarks.length===1){
    const index = handLandmarks[0][8];
    const x = index.x*canvas.width;
    const y = index.y*canvas.height;

    ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2); ctx.fillStyle="cyan"; ctx.fill();

    if(dragging){
      rect.x = x - dragOffset.x;
      rect.y = y - dragOffset.y;
    } else if(isPointInRect(x,y,rect)){
      dragging = true;
      dragOffset.x = x - rect.x;
      dragOffset.y = y - rect.y;
    }

  } else if(handLandmarks.length===2){
    const index1 = handLandmarks[0][8];
    const index2 = handLandmarks[1][8];

    const x1 = index1.x*canvas.width;
    const y1 = index1.y*canvas.height;
    const x2 = index2.x*canvas.width;
    const y2 = index2.y*canvas.height;

    ctx.beginPath(); ctx.arc(x1,y1,10,0,Math.PI*2); ctx.fillStyle="cyan"; ctx.fill();
    ctx.beginPath(); ctx.arc(x2,y2,10,0,Math.PI*2); ctx.fillStyle="cyan"; ctx.fill();

    rect.x = Math.min(x1,x2);
    rect.y = Math.min(y1,y2);
    rect.w = Math.abs(x2-x1);
    rect.h = Math.abs(y2-y1);
  } else {
    dragging = false;
  }

  ctx.fillStyle = rectColor;
  ctx.globalAlpha = 0.3;
  ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = rectColor;
  ctx.lineWidth = 4;
  ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);

  ctx.fillStyle = rectColor;
  ctx.font = "20px Arial";
  ctx.fillText("Virtual Shape", rect.x, rect.y-10);

  requestAnimationFrame(drawLoop);
}
drawLoop();
</script>

</body>
</html>
