<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face, Hand & Body Detection</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
body{
margin:0;
overflow:hidden;
background:black;
}
video, canvas{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
}
#status{
position:absolute;
top:10px;
left:10px;
color:white;
background:rgba(0,0,0,0.5);
padding:6px 10px;
font-family:sans-serif;
border-radius:6px;
}
</style>
</head>

<body>

<div id="status">Starting camera...</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");

let resultsData = null;

function isMobile(){
return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}
const FPS = isMobile() ? 10 : 12;

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Start camera
navigator.mediaDevices.getUserMedia({
video:{
width:{ideal:1280},
height:{ideal:720},
facingMode:"user"
}
})
.then(stream=>{
video.srcObject = stream;
statusText.innerText="Camera running";
})
.catch(err=>{
statusText.innerText="Camera error: "+err.message;
});

// Holistic model
const holistic = new Holistic({
locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`
});

holistic.setOptions({
modelComplexity:1,
smoothLandmarks:true,
enableSegmentation:false,
minDetectionConfidence:0.5,
minTrackingConfidence:0.5
});

holistic.onResults((results)=>{
resultsData = results;
});

const cameraMP = new Camera(video, {
onFrame: async () => {
await holistic.send({image: video});
},
width:1280,
height:720
});
cameraMP.start();

function drawBoxes(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.drawImage(video,0,0,canvas.width,canvas.height);

if(!resultsData) return;

// FACE box
if(resultsData.faceLandmarks){
let xVals = resultsData.faceLandmarks.map(l => l.x);
let yVals = resultsData.faceLandmarks.map(l => l.y);
let minX=Math.min(...xVals)*canvas.width;
let maxX=Math.max(...xVals)*canvas.width;
let minY=Math.min(...yVals)*canvas.height;
let maxY=Math.max(...yVals)*canvas.height;
ctx.fillStyle="rgba(0,255,0,0.25)";
ctx.strokeStyle="lime";
ctx.lineWidth=2;
ctx.fillRect(minX,minY,maxX-minX,maxY-minY);
ctx.strokeRect(minX,minY,maxX-minX,maxY-minY);
}

// HANDS box
["leftHandLandmarks","rightHandLandmarks"].forEach(hand=>{
if(resultsData[hand]){
let xVals = resultsData[hand].map(l=>l.x);
let yVals = resultsData[hand].map(l=>l.y);
let minX=Math.min(...xVals)*canvas.width;
let maxX=Math.max(...xVals)*canvas.width;
let minY=Math.min(...yVals)*canvas.height;
let maxY=Math.max(...yVals)*canvas.height;
ctx.fillStyle="rgba(0,120,255,0.25)";
ctx.strokeStyle="cyan";
ctx.fillRect(minX,minY,maxX-minX,maxY-minY);
ctx.strokeRect(minX,minY,maxX-minX,maxY-minY);
}
});

// BODY box
if(resultsData.poseLandmarks){
let xVals = resultsData.poseLandmarks.map(l=>l.x);
let yVals = resultsData.poseLandmarks.map(l=>l.y);
let minX=Math.min(...xVals)*canvas.width;
let maxX=Math.max(...xVals)*canvas.width;
let minY=Math.min(...yVals)*canvas.height;
let maxY=Math.max(...yVals)*canvas.height;
ctx.fillStyle="rgba(255,120,0,0.25)";
ctx.strokeStyle="orange";
ctx.fillRect(minX,minY,maxX-minX,maxY-minY);
ctx.strokeRect(minX,minY,maxX-minX,maxY-minY);
}
}

function loop(){
drawBoxes();
setTimeout(loop,1000/FPS);
}

video.onloadeddata=()=>{
loop();
};
</script>

</body>
</html>
