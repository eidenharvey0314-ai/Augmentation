<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VR Mobile Camera - Dual View HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Container that handles forced landscape transformation */
        #vr-stage {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            transition: transform 0.3s ease;
        }

        /* Forced portrait to landscape rotation */
        .force-landscape {
            position: absolute !important;
            width: 100vh !important;
            height: 100vw !important;
            transform: rotate(90deg);
            transform-origin: center center;
        }

        /* Dual Eye VR Split Layout */
        .vr-viewport-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-evenly;
            padding: 1vw;
            box-sizing: border-box;
            gap: 1.5vw;
        }

        /* Eye Box Frame Container matching reference image bezel */
        .eye-frame {
            position: relative;
            flex: 1;
            height: 92%;
            max-height: 95vh;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        /* Outer Bezel Overlay (Recreating image_0acdc2.png in SVG) */
        .bezel-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
        }

        /* Inner Video Stream Viewport */
        .video-viewport {
            position: absolute;
            top: 14%;
            left: 14%;
            width: 72%;
            height: 72%;
            border-radius: 18px;
            overflow: hidden;
            background: #050811;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Front camera mirror by default */
        }

        /* Yellow Translucent Overlay Graph Plane on Right Side of Eye View */
        .hud-graph-plane {
            position: absolute;
            right: 4%;
            top: 12%;
            width: 38%;
            height: 76%;
            background: rgba(255, 230, 0, 0.22);
            border: 1.5px solid rgba(255, 235, 59, 0.75);
            border-radius: 12px;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 10;
            box-shadow: 0 0 12px rgba(255, 235, 59, 0.25), inset 0 0 10px rgba(255, 235, 59, 0.15);
            display: flex;
            flex-direction: column;
            pointer-events: none;
            overflow: hidden;
        }

        /* Canvas for live waveform and grid */
        .graph-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Touch Start Overlay */
        #vr-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 24px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Hidden Video Element for Single Webcam Feed -->
    <video id="webcam-source" autoplay playsinline style="display: none;"></video>

    <!-- Tap to Start VR Overlay -->
    <div id="vr-overlay">
        <div class="w-16 h-16 rounded-2xl bg-yellow-400/20 border border-yellow-400/40 flex items-center justify-center mb-4 text-yellow-400 text-2xl animate-pulse">
            <i class="fa-solid fa-vr-cardboard"></i>
        </div>
        <h1 class="text-xl font-bold mb-2 tracking-wide">Mobile VR Camera Feed</h1>
        <p class="text-xs text-gray-400 max-w-xs mb-6 leading-relaxed">
            Tap anywhere to enter VR mode. Insert phone into VR goggle headset.
        </p>
        <button onclick="enterVRMode()" class="px-6 py-3 bg-yellow-400 hover:bg-yellow-300 text-black font-bold text-sm rounded-xl shadow-lg transition-all active:scale-95 flex items-center gap-2">
            <i class="fa-solid fa-play"></i> START VR MODE
        </button>
    </div>

    <!-- Main VR Dual Viewport Stage -->
    <div id="vr-stage">
        <div class="vr-viewport-container">

            <!-- LEFT EYE VIEWPORT -->
            <div class="eye-frame">
                <!-- Outer Frame Bezel (matching image_0acdc2.png) -->
                <svg class="bezel-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <!-- Outer Bezel Masking -->
                    <path d="M0,0 L100,0 L100,100 L0,100 Z M14,14 L14,86 L86,86 L86,14 Z" fill="#090a0f" fill-rule="evenodd" />
                    <!-- Outer Border Radius Frame -->
                    <rect x="2" y="2" width="96" height="96" rx="10" ry="10" fill="none" stroke="#ffffff" stroke-width="2.5"/>
                    <!-- Inner Border Radius Frame -->
                    <rect x="14" y="14" width="72" height="72" rx="6" ry="6" fill="none" stroke="#ffffff" stroke-width="2.2"/>
                    <!-- Diagonal Bevel Corner Connector Lines -->
                    <line x1="2" y1="2" x2="14" y2="14" stroke="#ffffff" stroke-width="2" />
                    <line x1="98" y1="2" x2="86" y2="14" stroke="#ffffff" stroke-width="2" />
                    <line x1="2" y1="98" x2="14" y2="86" stroke="#ffffff" stroke-width="2" />
                    <line x1="98" y1="98" x2="86" y2="86" stroke="#ffffff" stroke-width="2" />
                </svg>

                <!-- Video Viewport -->
                <div class="video-viewport">
                    <canvas id="left-eye-canvas" class="w-full h-full object-cover"></canvas>
                </div>

                <!-- Yellow HUD Graph Overlay Plane (Right Side) -->
                <div class="hud-graph-plane">
                    <div class="px-2 py-1 bg-yellow-400/20 border-b border-yellow-400/30 flex justify-between items-center text-[9px] font-mono font-bold text-yellow-300">
                        <span>PLT-L</span>
                        <span class="animate-pulse">● LIVE</span>
                    </div>
                    <canvas id="graph-left" class="graph-canvas"></canvas>
                </div>
            </div>

            <!-- RIGHT EYE VIEWPORT -->
            <div class="eye-frame">
                <!-- Outer Frame Bezel (matching image_0acdc2.png) -->
                <svg class="bezel-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <!-- Outer Bezel Masking -->
                    <path d="M0,0 L100,0 L100,100 L0,100 Z M14,14 L14,86 L86,86 L86,14 Z" fill="#090a0f" fill-rule="evenodd" />
                    <!-- Outer Border Radius Frame -->
                    <rect x="2" y="2" width="96" height="96" rx="10" ry="10" fill="none" stroke="#ffffff" stroke-width="2.5"/>
                    <!-- Inner Border Radius Frame -->
                    <rect x="14" y="14" width="72" height="72" rx="6" ry="6" fill="none" stroke="#ffffff" stroke-width="2.2"/>
                    <!-- Diagonal Bevel Corner Connector Lines -->
                    <line x1="2" y1="2" x2="14" y2="14" stroke="#ffffff" stroke-width="2" />
                    <line x1="98" y1="2" x2="86" y2="14" stroke="#ffffff" stroke-width="2" />
                    <line x1="2" y1="98" x2="14" y2="86" stroke="#ffffff" stroke-width="2" />
                    <line x1="98" y1="98" x2="86" y2="86" stroke="#ffffff" stroke-width="2" />
                </svg>

                <!-- Video Viewport -->
                <div class="video-viewport">
                    <canvas id="right-eye-canvas" class="w-full h-full object-cover"></canvas>
                </div>

                <!-- Yellow HUD Graph Overlay Plane (Right Side) -->
                <div class="hud-graph-plane">
                    <div class="px-2 py-1 bg-yellow-400/20 border-b border-yellow-400/30 flex justify-between items-center text-[9px] font-mono font-bold text-yellow-300">
                        <span>PLT-R</span>
                        <span class="animate-pulse">● LIVE</span>
                    </div>
                    <canvas id="graph-right" class="graph-canvas"></canvas>
                </div>
            </div>

        </div>
    </div>

    <script>
        const videoSource = document.getElementById('webcam-source');
        const leftEyeCanvas = document.getElementById('left-eye-canvas');
        const rightEyeCanvas = document.getElementById('right-eye-canvas');
        const ctxLeft = leftEyeCanvas.getContext('2d');
        const ctxRight = rightEyeCanvas.getContext('2d');

        const graphLeftCanvas = document.getElementById('graph-left');
        const graphRightCanvas = document.getElementById('graph-right');
        const ctxGraphL = graphLeftCanvas.getContext('2d');
        const ctxGraphR = graphRightCanvas.getContext('2d');

        let isVRStarted = false;
        let waveOffset = 0;

        // Initialize and lock orientation
        async function enterVRMode() {
            document.getElementById('vr-overlay').style.display = 'none';
            isVRStarted = true;

            // Request Fullscreen
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }

            // Try Locking Screen Orientation to Landscape
            if (screen.orientation && screen.orientation.lock) {
                try {
                    await screen.orientation.lock('landscape');
                } catch (e) {
                    console.log('Orientation lock not permitted, falling back to CSS force rotation.');
                }
            }

            // Start Camera Stream
            initCamera();
            checkOrientation();
        }

        // Camera Feed Initialization
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: 'environment' }, // Prefer back camera for VR passthrough
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                videoSource.srcObject = stream;
                videoSource.play();
                requestAnimationFrame(renderLoop);
            } catch (err) {
                console.warn('Environment camera failed, falling back to default camera:', err);
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    videoSource.srcObject = fallbackStream;
                    videoSource.play();
                    requestAnimationFrame(renderLoop);
                } catch (e) {
                    alert('Camera access denied or unavailable.');
                }
            }
        }

        // Force Orientation Handling (CSS Fallback if system lock fails)
        function checkOrientation() {
            const stage = document.getElementById('vr-stage');
            const isPortrait = window.innerHeight > window.innerWidth;

            if (isPortrait) {
                stage.classList.add('force-landscape');
            } else {
                stage.classList.remove('force-landscape');
            }
        }

        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);

        // Resize Canvases according to layout
        function resizeCanvases() {
            [leftEyeCanvas, rightEyeCanvas].forEach(c => {
                c.width = c.clientWidth * (window.devicePixelRatio || 1);
                c.height = c.clientHeight * (window.devicePixelRatio || 1);
            });

            [graphLeftCanvas, graphRightCanvas].forEach(g => {
                g.width = g.clientWidth * (window.devicePixelRatio || 1);
                g.height = g.clientHeight * (window.devicePixelRatio || 1);
            });
        }

        // Render Loop for Video Duplication and Graph Animation
        function renderLoop() {
            if (!isVRStarted) return;

            resizeCanvases();

            // 1. Draw Camera Feed to both Left & Right Eye Canvases
            if (videoSource.readyState === videoSource.HAVE_ENOUGH_DATA) {
                // Mirror/Draw Video
                [ctxLeft, ctxRight].forEach(ctx => {
                    const w = ctx.canvas.width;
                    const h = ctx.canvas.height;
                    ctx.save();
                    ctx.clearRect(0, 0, w, h);
                    ctx.drawImage(videoSource, 0, 0, w, h);
                    ctx.restore();
                });
            }

            // 2. Render Live Yellow Graph Plane Content
            waveOffset += 0.08;
            renderGraph(ctxGraphL);
            renderGraph(ctxGraphR);

            requestAnimationFrame(renderLoop);
        }

        // Draw Translucent Yellow Cartesian Graph
        function renderGraph(ctx) {
            const w = ctx.canvas.width;
            const h = ctx.canvas.height;

            ctx.clearRect(0, 0, w, h);

            // Grid Lines (Yellow translucent)
            ctx.strokeStyle = 'rgba(255, 235, 59, 0.25)';
            ctx.lineWidth = 1;

            const cols = 6;
            const rows = 6;
            const stepX = w / cols;
            const stepY = h / rows;

            for (let i = 0; i <= cols; i++) {
                ctx.beginPath();
                ctx.moveTo(i * stepX, 0);
                ctx.lineTo(i * stepX, h);
                ctx.stroke();
            }

            for (let j = 0; j <= rows; j++) {
                ctx.beginPath();
                ctx.moveTo(0, j * stepY);
                ctx.lineTo(w, j * stepY);
                ctx.stroke();
            }

            // Main Axes
            ctx.strokeStyle = 'rgba(255, 235, 59, 0.6)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, h / 2);
            ctx.lineTo(w, h / 2);
            ctx.moveTo(w / 2, 0);
            ctx.lineTo(w / 2, h);
            ctx.stroke();

            // Plot Waveform Line
            ctx.strokeStyle = '#ffee55';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = 'rgba(255, 235, 59, 0.8)';
            ctx.shadowBlur = 6;

            ctx.beginPath();
            for (let x = 0; x < w; x += 2) {
                const nx = (x / w) * 4 * Math.PI;
                const y = h / 2 + Math.sin(nx + waveOffset) * (h * 0.22) + Math.cos((nx * 0.5) - waveOffset) * (h * 0.08);
                if (x === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
            ctx.shadowBlur = 0; // Reset
        }
    </script>
</body>
</html>
